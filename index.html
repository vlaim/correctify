<!DOCTYPE html>
<html lang="en" class="dark:bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correctify</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'media'
        }
    </script>


    <link rel="manifest" href="manifest.json?v=1.1">
    <meta name="theme-color" content="#007bff">
    <link rel="icon" type="image/png" href="icons/icon-192x192.png">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.error('Service Worker registration failed', err));
        }
    </script>

    <style>

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 4px;
            background: #e5e7eb;
            outline: none;
        }

        @media (prefers-color-scheme: dark) {
            input[type="range"] {
                background: #4b5563;
            }
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #2563eb;
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: #2563eb;
        }

        /* Loader styling */
        .loader {
            border: 4px solid #f3f3f3; /* Light grey */
            border-top: 4px solid #3498db; /* Blue */
            border-radius: 50%;
            width: 30px; /* Adjust size */
            height: 30px; /* Adjust size */
            animation: spin 1s linear infinite;
            position: absolute; /* Position it inside the button */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%); /* Center the loader */
            display: none; /* Hidden by default */
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Custom select styling */
        .custom-select {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .select-dropdown {
            display: none;
            position: absolute;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 0.375rem;
            z-index: 1;
            width: 100%;
        }

        .select-dropdown div {
            padding: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .select-dropdown div:hover {
            background-color: #e5e7eb; /* Added hover effect for dropdown items */
        }

        .flag {
            width: 20px;
            height: 15px;
            margin-right: 0.5rem;
        }

        /* Accordion styling */
        .accordion {
            cursor: pointer;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 0.375rem;
            background-color: #e2e8f0; /* Changed background color for better visibility */
            margin-top: 1rem;
        }

        .accordion-content {
            display: none;
            padding: 1rem;
            border-top: 1px solid #ccc;
            background-color: #f9fafb; /* Added background color for content */
        }

        /* Button hover effects */
        button:hover {
            filter: brightness(0.9); /* Slightly darken buttons on hover */
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 flex flex-col items-center justify-center min-h-screen p-4">
<div class="text-center w-full max-w-lg">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Correctify</h1>

    <div class="mt-4 w-full">
        <textarea class="w-full p-2 border rounded-lg bg-white dark:bg-gray-800 dark:text-white dark:border-gray-700"
                  placeholder="Enter your text here..." id="messageInput" required></textarea> <!-- Added required -->
    </div>

    <div class="mt-3 w-full custom-select">
        <label for="languageSelect" class="block text-gray-700 dark:text-gray-300">Select Language:</label>
        <div id="selectedLanguage"
             class="w-full p-2 border rounded-lg bg-white dark:bg-gray-800 dark:text-white dark:border-gray-700 flex items-center justify-between cursor-pointer">
            <span id="selectedLanguageText">Polish (pl-PL)</span>
            <span class="caret">▼</span>
        </div>
        <div id="languageDropdown" class="select-dropdown">
            <div data-value="pl-PL" class="language-option">
                <img src="https://flagcdn.com/w20/pl.png" alt="Polish Flag" class="flag"> Polish (pl-PL)
            </div>
            <div data-value="en-US" class="language-option">
                <img src="https://flagcdn.com/w20/us.png" alt="English Flag" class="flag"> English (en-US)
            </div>
            <div data-value="ru-RU" class="language-option">
                <img src="https://flagcdn.com/w20/ru.png" alt="Russian Flag" class="flag"> Russian (ru-RU)
            </div>
        </div>
    </div>

    <!-- Accordion for scores -->
    <div class="accordion" id="scoreAccordion">Formality and Change Scores</div>
    <div class="accordion-content" id="scoreContent">
        <div class="mt-3 w-full">
            <label for="formalityScore" class="block text-gray-700 dark:text-gray-300">Formality Score:</label>
            <input type="range" class="w-full" id="formalityScore" min="1" max="5" value="3"
                   oninput="updateFormalityValue(this.value)" required> <!-- Added required -->
            <span id="formalityValue" class="text-gray-700 dark:text-gray-300">3</span>
        </div>

        <div class="mt-3 w-full">
            <label for="changeScore" class="block text-gray-700 dark:text-gray-300">Change Score:</label>
            <input type="range" class="w-full" id="changeScore" min="1" max="5" value="3"
                   oninput="updateChangeValue(this.value)" required> <!-- Added required -->
            <span id="changeValue" class="text-gray-700 dark:text-gray-300">3</span>
        </div>
    </div>

    <!-- Submit Button with Loader -->
    <button class="bg-green-500 hover:bg-green-600 text-white w-full py-3 mt-4 rounded-lg relative" id="submitButton">
        <span id="buttonText">Submit</span>
        <span id="loader" class="loader"></span> <!-- Loader inside button -->
    </button>

    <!-- Alert for error messages -->
    <div id="errorAlert" class="mt-4 hidden p-2 border border-red-500 bg-red-100 text-red-700 rounded-lg"
         role="alert"></div> <!-- Added error alert -->

    <!-- Response Display Section -->
    <div id="responseContainer" class="mt-4 w-full hidden" style="cursor: pointer;">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Response:</h2>
        <div id="responseText"
             class="p-2 border rounded-lg bg-white dark:bg-gray-800 dark:text-white dark:border-gray-700"></div>

    </div>
</div>

<script>
    function updateFormalityValue(value) {
        document.getElementById('formalityValue').textContent = value;
    }

    function updateChangeValue(value) {
        document.getElementById('changeValue').textContent = value;
    }

    document.getElementById('submitButton').addEventListener('click', function () {
        const userId = 1; // Define userId
        const locale = document.getElementById('selectedLanguageText').textContent.split('(')[1].trim().slice(0, -1); // Extract the locale from the selected language text
        const message = document.getElementById('messageInput').value;
        const formalityScore = document.getElementById('formalityScore').value;
        const changeScore = document.getElementById('changeScore').value;

        const requestData = {
            userId: userId,
            locale: locale,
            message: message,
            formalityScore: parseInt(formalityScore),
            changeScore: parseInt(changeScore)
        };

        // Show loader
        document.getElementById('loader').style.display = 'block'; // Show loader
        document.getElementById('buttonText').classList.add('hidden');
        document.getElementById('responseContainer').classList.add('hidden');
        document.getElementById('errorAlert').classList.add('hidden'); // Hide error alert

        fetch('http://localhost:3000/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestData)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                console.log('Success:', data);
                // Display the response text
                document.getElementById('responseText').textContent = data.response.text;
                document.getElementById('responseContainer').classList.remove('hidden');
            })
            .catch((error) => {
                console.error('Error:', error);
                // Display error message
                document.getElementById('errorAlert').textContent = 'An error occurred: ' + error.message;
                document.getElementById('errorAlert').classList.remove('hidden');
            })
            .finally(() => {
                // Hide loader
                document.getElementById('loader').style.display = 'none'; // Hide loader
                document.getElementById('buttonText').classList.remove('hidden');
            });
    });

    // Copy response text when clicking on the response container
    document.getElementById('responseContainer').addEventListener('click', function () {
        const responseText = document.getElementById('responseText').textContent;
        navigator.clipboard.writeText(responseText).then(() => {
            alert('Response copied to clipboard!');
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    });

    // Language selection functionality
    const selectedLanguage = document.getElementById('selectedLanguage');
    const languageDropdown = document.getElementById('languageDropdown');
    const selectedLanguageText = document.getElementById('selectedLanguageText');

    selectedLanguage.addEventListener('click', function () {
        languageDropdown.style.display = languageDropdown.style.display === 'block' ? 'none' : 'block';
    });

    document.querySelectorAll('.language-option').forEach(option => {
        option.addEventListener('click', function () {
            const value = this.getAttribute('data-value');
            const text = this.textContent.trim();
            selectedLanguageText.textContent = text;
            languageDropdown.style.display = 'none'; // Hide dropdown after selection
        });
    });

    // Close dropdown if clicked outside
    window.addEventListener('click', function (event) {
        if (!selectedLanguage.contains(event.target)) {
            languageDropdown.style.display = 'none';
        }
    });

    // Accordion functionality
    const scoreAccordion = document.getElementById('scoreAccordion');
    const scoreContent = document.getElementById('scoreContent');

    scoreAccordion.addEventListener('click', function () {
        const isVisible = scoreContent.style.display === 'block';
        scoreContent.style.display = isVisible ? 'none' : 'block';
    });
</script>
</body>
</html>
